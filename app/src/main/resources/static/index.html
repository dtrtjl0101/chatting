<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fee500">
  <title>모여톡 · 실시간 채팅</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#242424;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,460px);height:min(900px,100vh);min-height:570px;background:#abc5d1;display:flex;flex-direction:column;box-shadow:0 16px 60px #26323825}.top{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #eee}.brand{font-weight:800;font-size:19px;letter-spacing:-.6px}.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#24c875;margin-right:8px}.members{font-size:13px;color:#666;background:#f4f4f4;border-radius:20px;padding:8px 12px}.members b{color:#222;margin-left:4px}.room{padding:15px 20px 8px;text-align:center;font-size:12px;color:#526b74}.feed{flex:1;overflow:auto;padding:14px 18px 22px;display:flex;flex-direction:column;gap:13px}.system{align-self:center;color:#fff;background:#829ba4a8;padding:6px 12px;border-radius:15px;font-size:11px;margin:5px 0}.row{display:flex;align-items:flex-end;gap:7px;max-width:88%}.row.mine{align-self:flex-end;flex-direction:row-reverse}.avatar{width:34px;height:34px;border-radius:13px;background:#f2a679;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex:none}.bubble-wrap{display:flex;flex-direction:column;gap:5px}.name{font-size:11px;color:#34454b;padding-left:2px}.bubble{background:#fff;padding:10px 12px;border-radius:4px 14px 14px 14px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px #0000000a}.mine .bubble{background:#fee500;border-radius:14px 4px 14px 14px}.meta{font-size:10px;color:#53676d;white-space:nowrap;padding-bottom:2px}.composer{background:#fff;padding:12px 14px 14px;display:flex;gap:9px;border-top:1px solid #edf0f1}.composer input{min-width:0;flex:1;border:0;outline:0;background:#f4f5f5;border-radius:22px;padding:12px 16px;font:inherit;font-size:14px}.send{border:0;border-radius:18px;background:#fee500;padding:0 18px;font-weight:700;cursor:pointer}.send:hover{background:#f4d900}.overlay{position:fixed;inset:0;background:#1423278a;display:grid;place-items:center;padding:20px}.dialog{width:min(100%,350px);background:#fff;border-radius:20px;padding:27px;box-shadow:0 20px 60px #0003}.dialog h1{font-size:22px;margin:0 0 8px}.dialog p{margin:0 0 20px;color:#777;font-size:13px;line-height:1.5}.dialog input{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font:inherit;outline-color:#fee500}.dialog button{width:100%;margin-top:12px;border:0;border-radius:12px;background:#fee500;padding:13px;font-weight:700;font-size:14px;cursor:pointer}.status{font-size:11px;color:#73868b;margin-left:4px}@media(min-width:600px){.app{height:min(820px,92vh);border-radius:24px;overflow:hidden}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><i></i>모여톡</div><div class="members">👥 접속 중 <b id="count">0명</b></div></header>
    <div class="room">오늘도 편하게 이야기 나눠요 <span class="status" id="status">연결 중</span></div>
    <section class="feed" id="feed" aria-live="polite"></section>
    <form class="composer" id="form"><input id="message" maxlength="1000" placeholder="메시지를 입력하세요" autocomplete="off" aria-label="메시지"><button class="send">전송</button></form>
  </main>
  <div class="overlay" id="overlay"><form class="dialog" id="join"><h1>모여톡에 오신 걸 환영해요 👋</h1><p>친구들과 실시간으로 이야기를 나눠보세요.</p><input id="nickname" maxlength="24" placeholder="닉네임을 입력하세요" autocomplete="nickname" required><button>채팅 시작하기</button></form></div>
<script>
const feed=document.querySelector('#feed'), overlay=document.querySelector('#overlay'), statusEl=document.querySelector('#status');
let socket,name;
function addSystem(text,time){const el=document.createElement('div');el.className='system';el.textContent=`${text} · ${time}`;feed.append(el);feed.scrollTop=feed.scrollHeight}
function addMessage(m){const mine=m.name===name,row=document.createElement('article');row.className='row'+(mine?' mine':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(m.name||'?').slice(0,1);const wrap=document.createElement('div');wrap.className='bubble-wrap';if(!mine){const who=document.createElement('div');who.className='name';who.textContent=m.name;wrap.append(who)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;wrap.append(bubble);const time=document.createElement('time');time.className='meta';time.textContent=m.time;row.append(avatar,wrap,time);feed.append(row);feed.scrollTop=feed.scrollHeight}
function connect(){const scheme=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${scheme}://${location.host}/ws`);socket.addEventListener('open',()=>{statusEl.textContent='실시간 연결됨';socket.send(JSON.stringify({name}))});socket.addEventListener('message',e=>{const m=JSON.parse(e.data);if(m.type==='count')document.querySelector('#count').textContent=`${m.count}명`;else if(m.type==='message')addMessage(m);else if(m.type==='system')addSystem(m.text,m.time)});socket.addEventListener('close',()=>{statusEl.textContent='연결이 끊겼어요 · 다시 연결 중';setTimeout(connect,2000)});socket.addEventListener('error',()=>{statusEl.textContent='서버에 연결할 수 없어요'})}
document.querySelector('#join').addEventListener('submit',e=>{e.preventDefault();name=document.querySelector('#nickname').value.trim()||'익명';overlay.remove();connect();document.querySelector('#message').focus()});
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#message'),text=input.value.trim();if(!text||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({text}));input.value='';input.focus()});
</script>
</body>
</html>
