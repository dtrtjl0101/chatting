server.port=${SERVER_PORT:${PORT:8080}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chatting?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chatting}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chatting}

spring.flyway.enabled=true

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.forward-headers-strategy=framework
