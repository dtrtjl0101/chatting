services:
  app-blue:
    image: chatting-app:local
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: 8080
    expose: ["8080"]
    restart: unless-stopped
    networks: [chat]

  app-green:
    image: chatting-app:local
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: 8080
    expose: ["8080"]
    restart: unless-stopped
    networks: [chat]

  proxy:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/conf.d:ro
    restart: unless-stopped
    networks: [chat]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    env_file:
      - path: .env
        required: false
    profiles: [tunnel]
    restart: unless-stopped
    networks: [chat]
    depends_on: [proxy]

networks:
  chat:
